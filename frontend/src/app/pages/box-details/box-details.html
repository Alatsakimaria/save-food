<div class="box-page">
  <header class="page-header">
    <button routerLink="/home" class="back-button">‹</button>

    <div>
      <h1>{{ page.title }}</h1>
      <p>{{ page.subtitle }}</p>
    </div>
  </header>

  <section class="box-list">
    <article
      class="box-card"
      *ngFor="let box of page.items"
      [routerLink]="['/store', box.storeId]"
    >
      <img [src]="box.image" [alt]="box.store">

      <div class="box-info">
        <div class="box-top">
          <h2>{{ box.title }}</h2>
          <span>{{ box.available }}</span>
        </div>

        <p class="store-name">{{ box.store }}</p>
        <p>{{ box.description }}</p>
        <small>Pickup {{ box.pickup }}</small>

        <div class="price-row">
          <strong>€{{ box.price }}</strong>
          <del>€{{ box.oldPrice }}</del>
        </div>
      </div>
    </article>
  </section>
</div>
