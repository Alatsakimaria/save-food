<div class="best-page">
  <header class="page-header">
    <button routerLink="/home" class="back-button">
      <svg viewBox="0 0 24 24">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>

    <div>
      <p>Top deals for you</p>
      <h1>See all deals</h1>
    </div>
  </header>

  <section class="filter-row">
    <button
      *ngFor="let category of categories"
      [ngClass]="{ active: selectedCategory === category }"
      (click)="selectCategory(category)"
    >
      {{ category }}
    </button>
  </section>

  <section class="deal-list">
    <article
      class="deal-card"
      *ngFor="let deal of filteredDeals"
      [routerLink]="['/store', deal.id]"
    >
      <div class="image-box">
        <img [src]="deal.image" [alt]="deal.store">
      </div>

      <div class="deal-content">
        <div class="deal-top">
          <span>{{ deal.discount }}</span>
          <small class="rating-pill">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m12 2 2.9 6.1 6.7 1-4.8 4.7 1.1 6.6L12 17.2 6.1 20.4l1.1-6.6L2.4 9.1l6.7-1L12 2z"/>
            </svg>
            <span>{{ deal.rating }}</span>
          </small>
        </div>

        <h2>{{ deal.store }}</h2>
        <p>{{ deal.box }}</p>
        <small class="pickup">Pickup {{ deal.pickup }}</small>

        <div class="price">
          <strong>€{{ deal.price }}</strong>
          <del>€{{ deal.oldPrice }}</del>
        </div>
      </div>
    </article>
  </section>
</div>
