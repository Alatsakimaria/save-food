<div class="signin-page">
  <div class="form-container">
    <h1>Welcome Back</h1>

    <p>Sign in to reserve your favourite bakery boxes.</p>

    <form (ngSubmit)="login()">
      <div class="input-group">
        <input
          type="text"
          placeholder="Username"
          name="username"
          [(ngModel)]="username"
        >
      </div>

      <div class="input-group">
        <input
          type="password"
          placeholder="Password"
          name="password"
          [(ngModel)]="password"
        >
      </div>

      <p class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </p>

      <button type="submit" class="login-btn" [disabled]="isLoading">
        {{ isLoading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <p class="signup-text">
      Don't have an account?
      <span routerLink="/signup">Sign Up</span>
    </p>
  </div>
</div>
