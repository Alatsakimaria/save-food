<div class="signin-page">

  <div class="form-container">

    <h1>Welcome Back</h1>

    <p>
      Sign in to reserve your favourite bakery boxes.
    </p>

    <form>

      <div class="input-group">
        <input
          type="text"
          placeholder="Username">
      </div>

      <div class="input-group">
        <input
          type="password"
          placeholder="Password">
      </div>

      <button type="button" class="login-btn" routerLink="/home">
        Sign In
      </button>

    </form>

    <p class="signup-text">
      Don't have an account?
      <span>Sign Up</span>
    </p>

  </div>

</div>
