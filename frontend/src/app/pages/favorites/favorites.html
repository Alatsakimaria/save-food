<div class="favorites-page">
  <header class="page-header">
    <div>
      <h1>Favorites</h1>
      <p>Your saved bakeries</p>
    </div>
  </header>

  <section class="empty-state" *ngIf="favoriteStores.length === 0">
    <h2>No favorites yet</h2>
    <p>Save bakeries by tapping the heart on a store page.</p>
    <button routerLink="/home">Browse stores</button>
  </section>

  <section class="favorites-list" *ngIf="favoriteStores.length > 0">
    <article
      class="favorite-card"
      *ngFor="let store of favoriteStores"
      [routerLink]="['/store', store.id]"
    >
      <img [src]="store.image" [alt]="store.name">

      <div>
        <h2>{{ store.name }}</h2>
        <p>{{ store.description }}</p>
        <small>{{ store.pickupHours }}</small>
      </div>

      <button
        class="remove-button"
        (click)="removeFavorite(store.id); $event.stopPropagation()"
      >
        ×
      </button>
    </article>
  </section>
      <nav class="bottom-nav">
    <button class="nav-item" routerLink="/home">
        <svg viewBox="0 0 24 24">
        <path d="M3 10.8 12 3l9 7.8V21h-6v-6H9v6H3V10.8z"/>
        </svg>
        <small>Home</small>
    </button>

    <button class="nav-item" routerLink="/search">
        <svg viewBox="0 0 24 24">
        <path d="M21 21l-4.3-4.3m1.3-5.2a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0z"/>
        </svg>
        <small>Search</small>
    </button>

    <button class="nav-item active">
        <svg viewBox="0 0 24 24">
        <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/>
        </svg>
        <small>Favorites</small>
    </button>

    <button class="nav-item">
        <svg viewBox="0 0 24 24">
        <path d="M6 2h12v20l-3-2-3 2-3-2-3 2V2z"/>
        <path d="M9 7h6M9 11h6M9 15h4"/>
        </svg>
        <small>Orders</small>
    </button>
    </nav>
</div>
